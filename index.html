<canvas id="canvas"></canvas><nav class="heart-menu"><a href="memories.html">📷 Memories</a><a href="stars.html">✨ Stars</a><button id="musicToggle" hidden aria-expanded="false" aria-controls="miniPlayer">▶ Music</button></nav><audio id="loveMusic" loop preload="none"></audio><section id="miniPlayer" class="mini-player" hidden aria-label="Music player"><div class="mini-title"><span>♫ Our Song</span><button id="miniClose" aria-label="Close music player">×</button></div><div class="mini-controls"><button id="miniPlay" aria-label="Play or pause music">▶</button><span id="musicElapsed">0:00</span><input id="musicProgress" type="range" min="0" max="1000" value="0" aria-label="Song position"><span id="musicDuration">0:00</span></div><div class="mini-volume"><label for="miniVolume">Volume</label><input id="miniVolume" type="range" min="0" max="1" step=".05" value=".35"></div><p id="miniStatus" role="status"></p></section>

<script>
/* Check deployed build on return to the installed phone app. */
(()=>{const build="royal-heart-visible-20261009-10";let checking=false;
async function checkUpdate(){if(checking||document.hidden)return;checking=true;
try{const response=await fetch("./index.html?update="+Date.now(),{cache:"no-store"});
if(response.ok){const html=await response.text();const match=html.match(/<meta name="site-build" content="([^"]+)"/);
if(match&&match[1]!==build){location.reload();}}}catch(e){}finally{checking=false}}
window.addEventListener("pageshow",()=>setTimeout(checkUpdate,2500));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,120000);
})();

<script>
window.onload = () => {
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const centerText = document.getElementById('centerText');

const BPM = 72;
const beatInterval = 60000 / BPM;
const letters = ['L','O','V','E'];
let fontSize = 36;

let columns, rows;
let grid = [];
let columnsData = [];
let lastBeat = 0;
let pulsePhase = 0;

/* ===================== AUDIO (iOS SAFE) ===================== */
let audioCtx = null;

function initAudio() {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

async function ensureAudio() {
  initAudio();
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch(e){}
  }
}

/* ===================== VISUAL STATE ===================== */
let heartParticles = [];
let heartScale, heartCenterX, heartCenterY;
let cosmicStars=[];
const lowPower=matchMedia('(pointer:coarse)').matches || innerWidth<700;
const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
const targetFrame=1000/(reducedMotion?12:lowPower?20:24);
let previousFrame=0;

/* ===================== RESIZE ===================== */
function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;

  fontSize = Math.max(18, Math.min(42, canvas.width / (lowPower?19:27)));
  columns = Math.floor(canvas.width / fontSize);
  rows = Math.floor(canvas.height / fontSize);

  grid = Array(rows).fill(0).map((_, r) =>
    Array(columns).fill(0).map((_, c) => letters[(r + c) % letters.length])
  );

  columnsData = Array(columns).fill(0).map(() => ({
    pos: Math.random() * rows,
    speed: 0.04 + Math.random() * 0.08,
    trail: 2 + Math.floor(Math.random()*3)
  }));

  heartScale = Math.min(canvas.width, canvas.height) * 0.018 * (window.heartOptions?.heart_size || 1);
  heartCenterX = canvas.width / 2;
  heartCenterY = canvas.height / 2;

  cosmicStars=Array.from({length:Math.min(lowPower?25:45,Math.floor(canvas.width*canvas.height/12000))},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:.3+Math.random()*1.4,phase:Math.random()*6.28}));
  heartParticles = [];
  // Dense but delicate stardust: fixed bright rim plus softly moving interior.
  const count=reducedMotion?2100:lowPower?4200:6500;
  for(let i=0;i<count;i++){
    const outline=i<count*.23;
    const layer=Math.random();
    heartParticles.push({
      t:Math.random()*Math.PI*2,
      r:outline?.975+Math.random()*.025:Math.sqrt(Math.random())*.975,
      size:outline?1.15+Math.random()*.85:layer<.76?.9+Math.random()*.65:1.45+Math.random()*.9,
      alpha:outline?.65+Math.random()*.3:.35+Math.random()*.55,
      speed:(.07+Math.random()*.12)*(Math.random()<.5?-1:1),
      phase:Math.random()*Math.PI*2,
      outline,
      layer:layer<.48?0:layer<.88?1:2
    });
  }
}
window.addEventListener('resize', resize);
resize();

/* ===================== MATRIX ===================== */
function drawMatrix() {
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font = fontSize + 'px monospace';
  for (let c = 0; c < columns; c++) {
    let col = columnsData[c];
    for (let t = 0; t < col.trail; t++) {
      let r = Math.floor(col.pos - t);
      if (r < 0) r += rows;
      ctx.globalAlpha = (1 - t / col.trail) * 0.38;
      ctx.fillStyle = `rgb(${180+t*10},${100+t*8},255)`;
      ctx.fillText(grid[r][c], c*fontSize, r*fontSize);
    }
    col.pos += col.speed;
    if (col.pos >= rows) col.pos = 0;
  }
  ctx.globalAlpha = 1;
}

/* ===================== COSMIC STARS ===================== */
function drawStars(time){
 ctx.save();
 for(const s of cosmicStars){const a=.2+.5*(.5+.5*Math.sin(time*.0007+s.phase));ctx.fillStyle="rgba(221,184,255,"+a+")";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
/* ===================== VISIBLE SHOOTING STARS ===================== */
let shootingStar=null;
let nextShootingStar=performance.now()+3000;
function drawShootingStar(now){
 if(!shootingStar && now>=nextShootingStar){
  shootingStar={x:canvas.width*(.08+Math.random()*.48),y:canvas.height*(.08+Math.random()*.18),start:now,duration:1800};
  nextShootingStar=now+11000+Math.random()*6000;
 }
 if(!shootingStar)return;
 const p=(now-shootingStar.start)/shootingStar.duration;
 if(p>=1){shootingStar=null;return}
 const travel=Math.min(canvas.width*.38,330),x=shootingStar.x+p*travel,y=shootingStar.y+p*travel*.48;
 const opacity=Math.min(1,p*6,(1-p)*5);
 const tail=Math.min(canvas.width*.22,170);
 ctx.save();ctx.globalCompositeOperation='screen';
 const grad=ctx.createLinearGradient(x-tail,y-tail*.48,x,y);
 grad.addColorStop(0,'rgba(180,105,255,0)');
 grad.addColorStop(.6,'rgba(196,138,255,'+(.5*opacity)+')');
 grad.addColorStop(1,'rgba(255,255,255,'+opacity+')');
 ctx.strokeStyle=grad;ctx.lineWidth=lowPower?3:4;
 ctx.beginPath();ctx.moveTo(x-tail,y-tail*.48);ctx.lineTo(x,y);ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,'+opacity+')';
 ctx.beginPath();ctx.arc(x,y,lowPower?3:4,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
/* ===================== HEART ===================== */
function drawHeart() {
  const time=performance.now()*.001;
  const pulse=pulsePhase<.2?1+.10*Math.sin(pulsePhase/.2*Math.PI):1;
  centerText.style.transform=`translate(-50%, -50%) scale(${1+pulse*.12})`;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.shadowBlur=0;
  const color=window.heartOptions?.heart_color||'#c878ff';
  // Draw in three batches to retain color depth without expensive per-dot shadows.
  const palette=[color,'#e2a4ff','#fff0ff'];
  for(let layer=0;layer<3;layer++){
    ctx.beginPath();ctx.fillStyle=palette[layer];ctx.globalAlpha=layer===0?.95:layer===1?.95:1;
    for(const p of heartParticles){
      if(p.layer!==layer)continue;
      const angle=p.t+(reducedMotion?0:time*(p.outline?.23:p.speed));
      const radius=p.outline?p.r:Math.max(.025,Math.min(.975,p.r+.012*Math.sin(time*.9+p.phase)));
      const x=16*Math.pow(Math.sin(angle),3)*radius*heartScale*pulse;
      const y=-(13*Math.cos(angle)-5*Math.cos(2*angle)-2*Math.cos(3*angle)-Math.cos(4*angle))*radius*heartScale*pulse;
      ctx.moveTo(heartCenterX+x+p.size,heartCenterY+y);
      ctx.arc(heartCenterX+x,heartCenterY+y,p.size,0,Math.PI*2);
    }
    ctx.fill();
  }
  // Crisp outline: readable even while interior particles move.
  ctx.beginPath();
  for(let k=0;k<=180;k++){
    const a=k*Math.PI*2/180;
    const x=16*Math.pow(Math.sin(a),3)*heartScale*pulse;
    const y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*heartScale*pulse;
    if(k===0)ctx.moveTo(heartCenterX+x,heartCenterY+y);
    else ctx.lineTo(heartCenterX+x,heartCenterY+y);
  }
  ctx.closePath();ctx.globalAlpha=.62;ctx.strokeStyle='#d79aff';ctx.lineWidth=1.7;ctx.stroke();
  // Two fine comet streams instead of heavy white ribbons.
  ctx.lineCap='round';
  const trails=reducedMotion?0:2;
  for(let i=0;i<trails;i++){
    const head=time*.23+i*Math.PI;
    for(let j=0;j<2;j++){
      ctx.beginPath();
      for(let k=0;k<=24;k++){
        const angle=head-(24-k)*.014;
        const x=16*Math.pow(Math.sin(angle),3)*.995*heartScale*pulse;
        const y=-(13*Math.cos(angle)-5*Math.cos(2*angle)-2*Math.cos(3*angle)-Math.cos(4*angle))*.995*heartScale*pulse;
        if(k===0)ctx.moveTo(heartCenterX+x,heartCenterY+y);
        else ctx.lineTo(heartCenterX+x,heartCenterY+y);
      }
      ctx.globalAlpha=j===0?.23:.7;
      ctx.lineWidth=j===0?4:1.3;
      ctx.strokeStyle=j===0?'#a653ee':'#efc9ff';
      ctx.stroke();
    }
    const x=16*Math.pow(Math.sin(head),3)*.995*heartScale*pulse;
    const y=-(13*Math.cos(head)-5*Math.cos(2*head)-2*Math.cos(3*head)-Math.cos(4*head))*.995*heartScale*pulse;
    ctx.globalAlpha=.95;ctx.fillStyle='#fff3ff';
    ctx.beginPath();ctx.arc(heartCenterX+x,heartCenterY+y,1.9,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

/* ===================== ECG ===================== */
let ecgOffset = 0;
function drawECG() {
  const y = canvas.height / 2;
  const amplitude =
    pulsePhase < 0.18 ? 55 * Math.sin(pulsePhase * Math.PI / 0.18) : 8;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(180,120,255,0.4)';
  ctx.shadowColor = '#c77dff';
  ctx.shadowBlur = lowPower ? 0 : 5;
  ctx.lineWidth = 1.7;

  ctx.beginPath();
  for (let x = 0; x < canvas.width; x += 6) {
    let wave = Math.sin((x + ecgOffset) * 0.04) * amplitude;
    if(Math.abs(x-heartCenterX)<heartScale*17){ctx.moveTo(x,y+wave);continue}
    if(x===0||Math.abs(Math.abs(x-heartCenterX)-heartScale*17)<6)ctx.moveTo(x,y+wave);
    else ctx.lineTo(x,y+wave);
  }
  ctx.stroke();
  ctx.restore();
  ecgOffset += 6;
}

/* ===================== SOUND ===================== */
function playBeat(delay=0) {
  if (!audioCtx || audioCtx.state !== 'running') return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 110;

  const t = audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.exponentialRampToValueAtTime(0.4, t+0.04);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.2);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t+0.25);
}

function playHeartbeat() {
  playBeat(0);
  playBeat(0.18);
}

/* 🔥 iOS / PWA recovery hooks */
['touchstart','click'].forEach(evt =>
  window.addEventListener(evt, ensureAudio, { passive:true })
);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) ensureAudio();
});

window.addEventListener('pageshow', ensureAudio);

/* ===================== TAP HEART SPARKLES ===================== */
const sparkles=[];
canvas.addEventListener('pointerdown',event=>{
 const rect=canvas.getBoundingClientRect();
 const x=event.clientX-rect.left,y=event.clientY-rect.top;
 const dx=(x-heartCenterX)/(16*heartScale),dy=(heartCenterY-y)/(17*heartScale);
 if(dx*dx+dy*dy>1.7)return;
 const amount=reducedMotion?5:lowPower?13:22;
 for(let i=0;i<amount;i++){
  const a=Math.random()*Math.PI*2,v=30+Math.random()*75;
  sparkles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,born:performance.now(),life:450+Math.random()*450,size:1+Math.random()*2});
 }
});
function drawSparkles(now){
 ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='#f3c9ff';
 for(let i=sparkles.length-1;i>=0;i--){
  const p=sparkles[i],age=now-p.born;
  if(age>=p.life){sparkles.splice(i,1);continue}
  const t=age/1000;ctx.globalAlpha=1-age/p.life;
  ctx.beginPath();ctx.arc(p.x+p.vx*t,p.y+p.vy*t+25*t*t,p.size,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
/* ===================== LOOP ===================== */
function animate(time) {
  requestAnimationFrame(animate);
  if (document.hidden || (time - previousFrame < targetFrame)) return;
  previousFrame = time;
  drawMatrix();
  drawStars(time);
  if(!reducedMotion)drawShootingStar(time);
  pulsePhase = (time - lastBeat) / beatInterval;
  drawHeart();
  drawSparkles(time);
  drawECG();
  if (time - lastBeat > beatInterval) {
    playHeartbeat();
    lastBeat = time;
  }
}
requestAnimationFrame(animate);
};
</script>
