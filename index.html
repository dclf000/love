<script>
/* Check deployed build on return to the installed phone app. */
(()=>{const build="royal-heart-20261009-5";let checking=false;
async function checkUpdate(){if(checking||document.hidden)return;checking=true;
try{const response=await fetch("./index.html?update="+Date.now(),{cache:"no-store"});
if(response.ok){const html=await response.text();const match=html.match(/<meta name="site-build" content="([^"]+)"/);
if(match&&match[1]!==build){location.reload();}}}catch(e){}finally{checking=false}}
window.addEventListener("pageshow",()=>setTimeout(checkUpdate,2500));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,120000);
})();
</script>

<script>
window.onload = () => {
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const centerText = document.getElementById('centerText');

const BPM = 72;
const beatInterval = 60000 / BPM;
const letters = ['L','O','V','E'];
let fontSize = 36;

let columns, rows;
let grid = [];
let columnsData = [];
let lastBeat = 0;
let pulsePhase = 0;

/* ===================== AUDIO (iOS SAFE) ===================== */
let audioCtx = null;

function initAudio() {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

async function ensureAudio() {
  initAudio();
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch(e){}
  }
}

/* ===================== VISUAL STATE ===================== */
let heartParticles = [];
let heartScale, heartCenterX, heartCenterY;
let cosmicStars=[];
const lowPower=matchMedia('(pointer:coarse)').matches || innerWidth<700;
const targetFrame=1000/(lowPower?20:24);
let previousFrame=0;

/* ===================== RESIZE ===================== */
function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;

  fontSize = Math.max(18, Math.min(42, canvas.width / (lowPower?19:27)));
  columns = Math.floor(canvas.width / fontSize);
  rows = Math.floor(canvas.height / fontSize);

  grid = Array(rows).fill(0).map((_, r) =>
    Array(columns).fill(0).map((_, c) => letters[(r + c) % letters.length])
  );

  columnsData = Array(columns).fill(0).map(() => ({
    pos: Math.random() * rows,
    speed: 0.04 + Math.random() * 0.08,
    trail: 2 + Math.floor(Math.random()*3)
  }));

  heartScale = Math.min(canvas.width, canvas.height) * 0.018 * (window.heartOptions?.heart_size || 1);
  heartCenterX = canvas.width / 2;
  heartCenterY = canvas.height / 2;

  cosmicStars=Array.from({length:Math.min(lowPower?25:45,Math.floor(canvas.width*canvas.height/12000))},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:.3+Math.random()*1.4,phase:Math.random()*6.28}));
  heartParticles = [];
  const count=lowPower?1400:2100;
  for(let i=0;i<count;i++){
    const outline=i<count*.18;
    heartParticles.push({
      t:Math.random()*Math.PI*2,
      r:outline?.96+Math.random()*.04:Math.sqrt(Math.random())*.96,
      size:lowPower?1.35:1.6,
      alpha:.65+Math.random()*.35,
      speed:(.16+Math.random()*.20)*(Math.random()<.5?-1:1),
      phase:Math.random()*Math.PI*2,
      outline
    });
  }
}
window.addEventListener('resize', resize);
resize();

/* ===================== MATRIX ===================== */
function drawMatrix() {
  ctx.fillStyle = 'rgba(0,0,0,0.24)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font = fontSize + 'px monospace';
  for (let c = 0; c < columns; c++) {
    let col = columnsData[c];
    for (let t = 0; t < col.trail; t++) {
      let r = Math.floor(col.pos - t);
      if (r < 0) r += rows;
      ctx.globalAlpha = (1 - t / col.trail) * 0.75;
      ctx.fillStyle = `rgb(${180+t*10},${100+t*8},255)`;
      ctx.fillText(grid[r][c], c*fontSize, r*fontSize);
    }
    col.pos += col.speed;
    if (col.pos >= rows) col.pos = 0;
  }
  ctx.globalAlpha = 1;
}

/* ===================== COSMIC STARS ===================== */
function drawStars(time){
 ctx.save();
 for(const s of cosmicStars){const a=.2+.5*(.5+.5*Math.sin(time*.0007+s.phase));ctx.fillStyle="rgba(221,184,255,"+a+")";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
/* ===================== OCCASIONAL SHOOTING STARS ===================== */
let shootingStar=null;
let nextShootingStar=performance.now()+11000+Math.random()*8000;
function drawShootingStar(now){
 if(!shootingStar && now>=nextShootingStar){
  const startX=canvas.width*(.15+Math.random()*.65);
  shootingStar={x:startX,y:canvas.height*(.05+Math.random()*.28),start:now,duration:850+Math.random()*450};
  nextShootingStar=now+16000+Math.random()*14000;
 }
 if(!shootingStar)return;
 const p=(now-shootingStar.start)/shootingStar.duration;
 if(p>=1){shootingStar=null;return}
 const x=shootingStar.x+p*Math.min(canvas.width*.32,250);
 const y=shootingStar.y+p*Math.min(canvas.height*.28,180);
 const opacity=Math.sin(Math.PI*p)*.75;
 ctx.save();
 ctx.globalCompositeOperation='screen';
 const tail=Math.min(canvas.width*.14,105);
 const g=ctx.createLinearGradient(x-tail,y-tail*.65,x,y);
 g.addColorStop(0,'rgba(210,160,255,0)');
 g.addColorStop(1,'rgba(237,206,255,'+opacity+')');
 ctx.strokeStyle=g;ctx.lineWidth=lowPower?1.3:1.8;
 ctx.beginPath();ctx.moveTo(x-tail,y-tail*.65);ctx.lineTo(x,y);ctx.stroke();
 ctx.fillStyle='rgba(255,236,255,'+opacity+')';
 ctx.beginPath();ctx.arc(x,y,lowPower?1.5:2.2,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
/* ===================== HEART ===================== */
function drawHeart() {
  const time=performance.now()*.001;
  const pulse=pulsePhase<.2?1+.13*Math.sin(pulsePhase/.2*Math.PI):1;
  centerText.style.transform=`translate(-50%, -50%) scale(${1+pulse*.12})`;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.shadowBlur=0;
  ctx.fillStyle=window.heartOptions?.heart_color||'#c878ff';
  ctx.globalAlpha=.82;
  ctx.beginPath();
  for(const p of heartParticles){
    // Interior particles circulate visibly; the outline stays crisp and heart-shaped.
    const angle=p.t+time*(p.outline?.22:p.speed);
    const radius=p.outline?p.r:Math.max(.02,Math.min(.97,p.r+.025*Math.sin(time*1.3+p.phase)));
    const x=16*Math.pow(Math.sin(angle),3)*radius*heartScale*pulse;
    const y=-(13*Math.cos(angle)-5*Math.cos(2*angle)-2*Math.cos(3*angle)-Math.cos(4*angle))*radius*heartScale*pulse;
    ctx.moveTo(heartCenterX+x+p.size,heartCenterY+y);
    ctx.arc(heartCenterX+x,heartCenterY+y,p.size,0,Math.PI*2);
  }
  ctx.fill();
  // A few bright trailing sparks follow the moving outline, with no costly blur per particle.
  ctx.beginPath();
  ctx.globalAlpha=.52;
  ctx.fillStyle='#e5b7ff';
  const trailCount=lowPower?9:15;
  for(let i=0;i<trailCount;i++){
    const base=(i/trailCount)*Math.PI*2+time*.22;
    for(let j=0;j<4;j++){
      const a=base-j*.018;
      const radius=.995-j*.006;
      const x=16*Math.pow(Math.sin(a),3)*radius*heartScale*pulse;
      const y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*radius*heartScale*pulse;
      const size=(lowPower?1.65:2.1)*(1-j*.2);
      ctx.moveTo(heartCenterX+x+size,heartCenterY+y);
      ctx.arc(heartCenterX+x,heartCenterY+y,size,0,Math.PI*2);
    }
  }
  ctx.fill();
  ctx.restore();
}

/* ===================== ECG ===================== */
let ecgOffset = 0;
function drawECG() {
  const y = canvas.height / 2;
  const amplitude =
    pulsePhase < 0.18 ? 55 * Math.sin(pulsePhase * Math.PI / 0.18) : 8;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(180,120,255,0.8)';
  ctx.shadowColor = '#c77dff';
  ctx.shadowBlur = lowPower ? 0 : 5;
  ctx.lineWidth = 2.5;

  ctx.beginPath();
  for (let x = 0; x < canvas.width; x += 6) {
    let wave = Math.sin((x + ecgOffset) * 0.04) * amplitude;
    if (x === 0) ctx.moveTo(x, y + wave);
    else ctx.lineTo(x, y + wave);
  }
  ctx.stroke();
  ctx.restore();
  ecgOffset += 6;
}

/* ===================== SOUND ===================== */
function playBeat(delay=0) {
  if (!audioCtx || audioCtx.state !== 'running') return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 110;

  const t = audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.exponentialRampToValueAtTime(0.4, t+0.04);
  gain.gain.exponentialRampToValueAtTime(0.001, t+0.2);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t+0.25);
}

function playHeartbeat() {
  playBeat(0);
  playBeat(0.18);
}

/* 🔥 iOS / PWA recovery hooks */
['touchstart','click'].forEach(evt =>
  window.addEventListener(evt, ensureAudio, { passive:true })
);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) ensureAudio();
});

window.addEventListener('pageshow', ensureAudio);

/* ===================== LOOP ===================== */
function animate(time) {
  requestAnimationFrame(animate);
  if (document.hidden || (time - previousFrame < targetFrame)) return;
  previousFrame = time;
  drawMatrix();
  drawStars(time);
  drawShootingStar(time);
  pulsePhase = (time - lastBeat) / beatInterval;
  drawHeart();
  drawECG();
  if (time - lastBeat > beatInterval) {
    playHeartbeat();
    lastBeat = time;
  }
}
requestAnimationFrame(animate);
};
</script>
<script defer src="visitor-tracker.js"></script>
