<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Starry Sky ✨</title><style>
html,body{margin:0;background:#05030d;color:#f5e7ff;font:16px system-ui;overflow:hidden}canvas{position:fixed;inset:0}header{position:fixed;top:0;left:0;right:0;text-align:center;z-index:1;padding:15px;pointer-events:none}header a{pointer-events:auto;color:#d9aaff}#note{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);width:min(85%,480px);text-align:center;background:#20122bcc;padding:18px;border:1px solid #ad79e2;border-radius:16px;z-index:1}</style></head><body>
<canvas id="sky"></canvas><header><h1>✨ Our Starry Sky</h1><p>Tap a star to reveal a memory</p><a href="./">Back to our heart</a> · <a href="memories.html">Our Memories</a></header><div id="note">Every star reminds me of you ❤️</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d"),note=document.getElementById("note");let stars=[],messages=["Every star reminds me of you ❤️"];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;stars=Array.from({length:90},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:1+Math.random()*2.3,a:Math.random()*6.28}))}addEventListener("resize",resize);resize();
function draw(){ctx.fillStyle="#05030d";ctx.fillRect(0,0,canvas.width,canvas.height);for(const s of stars){ctx.beginPath();ctx.fillStyle="rgba(216,168,255,"+(.5+.5*Math.sin(Date.now()/850+s.a))+")";ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}draw();
canvas.addEventListener("click",e=>{let nearest=stars[0],dist=Infinity;for(const s of stars){const d=(s.x-e.clientX)**2+(s.y-e.clientY)**2;if(d<dist){dist=d;nearest=s}}if(dist<4500)note.textContent=messages[stars.indexOf(nearest)%messages.length]});
const client=supabase.createClient("https://sflilptubekduvxqpiiw.supabase.co","sb_publishable_PoY_xXp55Iz0ho4gg0cIhw_JUdGt7Yh");
Promise.all([client.from("heart_site_settings").select("messages").eq("id",1).single(),client.from("heart_photos").select("caption").limit(50)]).then(([settings,photos])=>{const items=[...(settings.data?.messages||[]),...(photos.data||[]).map(x=>x.caption).filter(Boolean)];if(items.length)messages=items}).catch(()=>{});
</script></body></html>
